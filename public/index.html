<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Freight Forwarding Import Dashboard</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" src="/logo.png" alt="Fixmart">
    <div class="brand-divider"></div>
    <div>
      <h1>Freight Forwarding Import Dashboard</h1>
      <div class="sub" id="meta-line">Loading…</div>
    </div>
  </div>
  <div class="header-actions">
    <span class="refresh-note" id="refresh-note"></span>
    <span class="badge-sample" id="sample-badge" style="display:none">Sample data · not connected to BigQuery</span>
    <button class="refresh" id="refresh-btn" type="button">Check for new data</button>
  </div>
</header>

<main>
  <div id="error"></div>
  <nav class="tabs">
    <button id="tab-btn-overview" class="active" type="button">Overview</button>
    <button id="tab-btn-trends" type="button">Trends</button>
    <button id="tab-btn-calendar" type="button">Calendar</button>
  </nav>

  <div id="tab-overview">
  <section class="kpis" id="kpis"></section>

  <div class="filters">
    <label for="route-filter">Route</label>
    <select id="route-filter"></select>
    <input id="ship-search" type="search" placeholder="Find container, box, supplier or note text">
    <a class="dl" href="/api/shipments.csv" download>Download CSV</a>
    <span class="scope-note" id="filter-note">Filters the sections below · headline figures above stay whole-book</span>
  </div>

  <section class="grid">
    <div class="card wide" id="card-landing"></div>
    <div class="card" id="card-forwarders"></div>
    <div class="card" id="card-routes"></div>
    <div class="card wide" id="card-trend"></div>
    <div class="card wide" id="card-split"></div>
    <div class="card wide" id="card-transit"></div>
  </section>
  </div>

  <div id="tab-trends" style="display:none">
    <section class="grid">
      <div class="card wide" id="card-tr-cost"></div>
      <div class="card wide" id="card-tr-volume"></div>
      <div class="card wide" id="card-tr-transit"></div>
      <div class="card wide" id="card-tr-spend"></div>
    </section>
  </div>

  <div id="tab-calendar" style="display:none">
    <section class="grid">
      <div class="card wide" id="card-cal"></div>
    </section>
  </div>
</main>

<div id="tooltip"></div>

<script src="/app.js"></script>
</body>
</html>
